name: bettank
description: Smart Betta Fish Aquarium Monitoring System - BETANK

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.1.0
  fl_chart: ^0.66.2
  cupertino_icons: ^1.0.6
  firebase_core: ^3.6.0
  firebase_database: ^11.1.6
  shared_preferences: ^2.3.2
  flutter_local_notifications: ^17.2.3
  flutter_background_service: ^5.0.5
  firebase_auth: ^5.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/BETTANKlogo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/images/BETTANKlogo.png